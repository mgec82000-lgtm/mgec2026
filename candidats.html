<!-- HEADER -->

    <div class="nav">
      <a class="brand" href="index.html">
        <div class="brandLogo"></div>
        <div class="brandTitle">
          <small>#MONTAUBAN2026</small>
          MONTAUBAN<br>
          <span style="color:var(--purple)">De gauche, écologiste et citoyenne</span>
        </div>

      <button class="burger" aria-label="Menu" onclick="toggleMenu()">☰</button>

      <div class="menu" id="mobileMenu">
        <a href="index.html">ACCUEIL</a>

<!-- CONTENU -->
<section class="section">
  <div class="container">
    <h1 class="h1">Nos candidats</h1>
    <p class="sub">Une équipe engagée et représentative de la diversité montaubanaise.</p>

    <!-- ✅ Grille photos uniquement -->
    <div id="candidats-grid" class="candidats-grid photos-only"></div>
  </div>
</section>

<!-- FOOTER -->
<div class="footer">
  <div class="container">© 2026 – Montauban 2026</div>
</div>

<script src="script.js"></script>

<script>
(function () {
  const grid = document.getElementById("candidats-grid");
  const total = 50; // ✅ nombre de photos

  let html = "";
  for (let i = 1; i <= total; i++) {
    html += `
      <article class="candidateCard photoCard">
        <img
          src="./assets/candidats/${i}.jpg"
          alt="Candidat ${i}"
          loading="lazy"
          onerror="this.closest('.photoCard').style.display='none';"
        >
      </article>
    `;
  }
  grid.innerHTML = html;
})();
</script>

</body>
