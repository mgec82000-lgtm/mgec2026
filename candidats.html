<!-- ✅ Script affichage candidats -->
<script>
fetch("assets/candidats.json")
  .then(response => response.json())
  .then(data => {

    const grid = document.getElementById("candidats-grid");

    function photoFromFirstName(firstName) {
      return firstName
        .normalize("NFD")                   // enlève accents
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]/g, "")       // enlève espaces / tirets
        .toLowerCase() + ".jpg";
    }

    grid.innerHTML = data.map(c => {

      const photo = photoFromFirstName(c.first_name);

      return `
        <article class="candidateCard">
          <img 
            src="assets/candidats/${photo}" 
            alt="${c.first_name} ${c.last_name}"
            onerror="this.src='assets/candidats/default.jpg'">

          <div class="candidateInfo">
            <div class="badge">Candidat</div>
            <h3>${c.first_name} ${c.last_name}</h3>
            <p>${c.role || ""}</p>

            <div class="tags">
              <span class="tag">${c.district || ""}</span>
            </div>
          </div>
        </article>
      `;
    }).join("");

  })
  .catch(error => {
    console.error("Erreur chargement JSON :", error);
  });
</script>

</body>
