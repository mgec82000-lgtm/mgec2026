  <meta charset="utf-8" />

  <title>Candidats – Montauban 2026</title>
  <link rel="stylesheet" href="style.css?v=2026">
</head>

<body class="page-candidats">

<div class="topbar">
  <div class="container">
    <div class="nav">

      <a class="brand" href="index.html" style="text-decoration:none;">
        <div class="brandLogo"></div>
        <div class="brandTitle">
          <small>#MONTAUBAN2026</small>
          MONTAUBAN<br>
          <span style="color:var(--purple)">De gauche, écologiste et citoyenne</span>
        </div>
      </a>

      <button class="burger" aria-label="Menu" onclick="toggleMenu()">☰</button>

      <div class="menu" id="mobileMenu">
        <a href="index.html">ACCUEIL</a>
        <a href="agenda.html">AGENDA</a>
        <a class="active" href="candidats.html">CANDIDATS</a>
        <a href="programme.html">PROGRAMME</a>
        <a href="medias.html">MÉDIAS</a>
        <a href="communiques.html">COMMUNIQUÉS</a>
        <a href="blog.html">BLOG</a>
        <a href="contact.html">CONTACT</a>
      </div>

    </div>
  </div>
</div>

<section class="section">
  <div class="container">
    <h1 class="h1">Nos candidats</h1>
    <p class="sub">Une équipe engagée et représentative de la diversité montaubanaise.</p>

    <div id="candidats-grid" class="candidats-grid"></div>
  </div>
</section>

<!-- ✅ LIGHTBOX : mets-la juste avant </body> (overlay au-dessus de tout) -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightboxInner" role="dialog" aria-modal="true" aria-label="Photo en grand">
    <button class="lightboxClose" id="lightboxClose" aria-label="Fermer">✕</button>
    <img id="lightboxImg" alt="Photo candidat">
    <div class="lightboxCaption" id="lightboxCaption" style="display:none;"></div>
  </div>
</div>

<div class="footer">
  <div class="container">© 2026 – Montauban 2026</div>
</div>

<script src="script.js?v=2026"></script>

<script>
fetch("assets/candidats.json?v=2026")
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById("candidats-grid");

    grid.innerHTML = data.map(c => {
      const src = `assets/candidats/${c.photo}`;
      return `
        <article class="candidateCard">
          <button class="candidateBtn" type="button" data-src="${src}" aria-label="Ouvrir la photo">
            <img src="${src}" alt="Photo candidat">
          </button>
        </article>
      `;
    }).join("");

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const closeBtn = document.getElementById("lightboxClose");

    function openLightbox(src){
      lightboxImg.src = src;
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden","false");
      document.body.classList.add("noScroll");
      closeBtn.focus();
    }

    function closeLightbox(){
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden","true");
      document.body.classList.remove("noScroll");
      lightboxImg.src = "";
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest(".candidateBtn");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      openLightbox(btn.dataset.src);
    });

    closeBtn.addEventListener("click", (e) => {
      e.preventDefault();
      closeLightbox();
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("open")) closeLightbox();
    });
  })
  .catch(err => console.error("Erreur JSON :", err));
</script>

</body>
</html>
