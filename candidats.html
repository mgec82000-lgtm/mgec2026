<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="container">
    <div class="nav">

      <a class="brand" href="index.html">
        <div class="brandLogo"></div>
        <div class="brandTitle">
          <small>#MONTAUBAN2026</small>
          MONTAUBAN<br>
          <span style="color:var(--purple)">De gauche, écologiste et citoyenne</span>
        </div>
      </a>

      <button class="burger" aria-label="Menu" onclick="toggleMenu()">☰</button>

      <div class="menu" id="mobileMenu">
        <a href="index.html">ACCUEIL</a>
        <a href="agenda.html">AGENDA</a>
        <a class="active" href="candidats.html">CANDIDATS</a>
        <a href="programme.html">PROGRAMME</a>
        <a href="medias.html">MÉDIAS</a>
        <a href="contact.html">CONTACT</a>
      </div>

    </div>
  </div>
</div>

<!-- CONTENU -->
<section class="section">
  <div class="container">

    <h1 class="h1">Nos candidats</h1>
    <p class="sub">Une équipe engagée et représentative de la diversité montaubanaise.</p>

    <!-- DEBUG (pour voir si le JSON charge) -->
    <p id="debug-json" style="font-size:12px;opacity:.7;margin:8px 0;"></p>

    <div id="candidats-grid" class="candidats-grid"></div>

  </div>
</section>

<div class="footer">
  <div class="container">© 2026 – Montauban 2026</div>
</div>

<script src="script.js"></script>

<script>
(async function () {
  const debug = document.getElementById("debug-json");
  const grid = document.getElementById("candidats-grid");

  // ✅ CHEMIN SÛR : candidats.html est à la racine, donc JSON = ./assets/candidats.json
  const jsonUrl = "./assets/candidats.json";

  try {
    const res = await fetch(jsonUrl, { cache: "no-store" });
    debug.textContent = "Fetch JSON: " + jsonUrl + " → status " + res.status;

    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    debug.textContent += " | candidats: " + data.length;

    grid.innerHTML = data.map(c => `
      <article class="candidateCard">
        <img
          src="./assets/candidats/${c.photo}"
          alt="${c.prenom} ${c.nom}"
          loading="lazy"
          onerror="this.style.display='none';"
        >
        <div class="candidateInfo">
          <div class="badge">${c.badge || ""}</div>
          <h3>${c.prenom} ${c.nom}</h3>
          <p>${c.role || ""}</p>
          <div class="tags">
            ${(c.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}
          </div>
        </div>
      </article>
    `).join("");

  } catch (e) {
    console.error(e);
    debug.textContent = "ERREUR JSON: " + e.message + " (ouvre la console)";
    grid.innerHTML = `<p style="color:red">Erreur chargement candidats.json</p>`;
  }
})();
</script>

</body>
        </html>
