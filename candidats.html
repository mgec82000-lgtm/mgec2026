<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Candidats – Montauban 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="container">
    <div class="nav">

      <!-- Logo + Titre -->
      <a class="brand" href="index.html">
        <div class="brandLogo"></div>
        <div class="brandTitle">
          <small>#MONTAUBAN2026</small>
          MONTAUBAN<br>
          <span style="color:var(--purple)">De gauche, écologiste et citoyenne</span>
        </div>
      </a>

      <!-- Bouton burger -->
      <button class="burger" aria-label="Menu" onclick="toggleMenu()">☰</button>

      <!-- MENU -->
      <div class="menu" id="mobileMenu">
        <a href="index.html">ACCUEIL</a>
        <a href="agenda.html">AGENDA</a>
        <a class="active" href="candidats.html">CANDIDATS</a>
        <a href="programme.html">PROGRAMME</a>
        <a href="medias.html">MÉDIAS</a>
        <a href="contact.html">CONTACT</a>
      </div>

    </div>
  </div>
</div>

<!-- CONTENU -->
<section class="section">
  <div class="container">

    <h1 class="h1">Nos candidats</h1>
    <p class="sub">
      Une équipe engagée et représentative de la diversité montaubanaise.
    </p>

    <!-- Grille candidats -->
    <div id="candidats-grid" class="candidats-grid"></div>

  </div>
</section>

<!-- FOOTER -->
<div class="footer">
  <div class="container">© 2026 – Montauban 2026</div>
</div>

<!-- Script global -->
<script src="script.js"></script>

<!-- Script affichage candidats -->
<script>
fetch("assets/candidats.json")
  .then(response => response.json())
  .then(data => {
    const grid = document.getElementById("candidats-grid");

    grid.innerHTML = data.map(c => `
      <article class="candidateCard">
        <img src="assets/candidats/${c.photo}" alt="${c.first_name} ${c.last_name}">
        <div class="candidateInfo">
          <div class="badge">Candidat</div>
          <h3>${c.first_name} ${c.last_name}</h3>
          <p>${c.role || ""}</p>
          <div class="tags">
            <span class="tag">${c.district || ""}</span>
          </div>
        </div>
      </article>
    `).join("");
  })
  .catch(error => {
    console.error("Erreur chargement JSON :", error);
  });
</script>

</body>
  </html>
